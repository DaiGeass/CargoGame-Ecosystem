[package]
name = "cargas"
version = "1.0.1"
description = "CARGAS - Juego de cartas estratégico"
authors = ["CARGAS Team"]
edition = "2021"
rust-version = "1.70"

# Binario principal (el juego)
[[bin]]
name = "cargas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"

[features]
# Por defecto Tauri usa la configuración custom-protocol en release
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
